[package]
name = "asset-forge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Asset Forge: asset library, production tracking, checks and engine export"

[lib]
name = "asset_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"
walkdir = "2"
blake3 = "1"
imagesize = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tga", "webp"] }
forge-launch-guard = { path = "../../../crates/launch-guard" }

[dev-dependencies]
tempfile = "3"
