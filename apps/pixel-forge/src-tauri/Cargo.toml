[package]
name = "pixel-forge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Pixel Forge: sketches to game-ready pixel art, rigging and animation"

[lib]
name = "pixel_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
base64 = "0.22"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "multipart", "json", "query"] }
forge-launch-guard = { path = "../../../crates/launch-guard" }
forge-paths = { path = "../../../crates/forge-paths" }

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# Android has no system OpenSSL, so Forge Suite for Android builds one into the app.
[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls-vendored", "multipart", "json", "query"] }

[dev-dependencies]
tempfile = "3"
